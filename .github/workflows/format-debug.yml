name: Format debug

on:
  push:
    paths:
      - '.github/workflows/format-debug.yml'

permissions:
  contents: read

jobs:
  format-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier src/ui/App.tsx --write
      - name: Show Prettier diff
        run: git diff -- src/ui/App.tsx
